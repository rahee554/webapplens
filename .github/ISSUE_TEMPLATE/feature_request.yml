name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? A CLI flag, a new document, a new agent role?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Crawler, Inspector, CLI, Safety or scope, Documentation generation, Agent roles, Installer or platform, Tests or CI, Docs, Other]
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Does this change what the tool may do to a target application?
      description: For example, sending requests, clicking more controls, or lifting a guard. Such changes need extra review.
      options: ["No", "Yes, it adds capability", "Yes, it tightens safety", "Not sure"]
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
        - label: This does not require bypassing CAPTCHA, MFA, paywalls, or rate limits (those will not be accepted).
          required: true
