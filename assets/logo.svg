    <circle cx="114" cy="114" r="68" fill="url(#wal-glass)" stroke="#fff" stroke-width="14"/>
    <line x1="165" y1="165" x2="214" y2="214" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <rect x="76" y="82" width="76" height="64" rx="9" fill="none" stroke="#fff" stroke-width="6"/>
    <line x1="76" y1="100" x2="152" y2="100" stroke="#fff" stroke-width="6"/>
    <circle cx="87" cy="91" r="3" fill="#fff"/><circle cx="97" cy="91" r="3" fill="#fff"/>
    <line x1="88" y1="112" x2="88" y2="134" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="102" y1="114" x2="138" y2="114" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="102" y1="127" x2="126" y2="127" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M64 100a52 52 0 0 1 26-30" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
