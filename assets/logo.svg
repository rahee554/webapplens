  <text x="288" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2">
    <tspan fill="#6366f1">WebApp</tspan><tspan fill="#06b6d4">Lens</tspan>
