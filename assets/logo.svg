  <text x="292" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#8b8fa3" letter-spacing="0.5">Research any web app. Safely. With evidence.</text>
